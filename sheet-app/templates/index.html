<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Characters</title>
<style>
  body { font-family: Georgia, "Times New Roman", serif; background: #ccc; margin: 0; padding: 40px; box-sizing: border-box; }
  @media (max-width: 600px) {
    body { padding: 16px; }
  }
  .list-box { background: #f5ecd8; max-width: 500px; margin: 0 auto; padding: 24px; border: 2px solid #1c1a16; }
  h1 { margin-top: 0; }
  ul { padding-left: 20px; }
  a { color: #7a1414; text-decoration: none; font-weight: bold; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="list-box">
    <h1>Characters</h1>
    <ul>
      {% for char in characters %}
      <li><a href="/characters/{{ char.id }}">{{ char.name }}</a></li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
