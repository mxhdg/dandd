services:
  sheet-app:
    container_name: sheet-app-dev
    labels:
      environment: "dev"
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    ports:
      - "8889:5000"
    volumes:
      - ./data:/app/data
      - ./state:/app/state
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
