services:
  sheet-app:
    image: ghcr.io/mxhdg/dandd/sheet-app:${SHEET_APP_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8889:5000"
    volumes:
      - /opt/sheet-app/data:/app/data
      - /opt/sheet-app/state:/app/state
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
