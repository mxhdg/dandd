name: codex tests

on:
  pull_request:
    paths:
      - "codex/**"
      - "!codex/**/*.md"
      - ".github/workflows/codex-tests.yml"
  push:
    branches: [main]
    paths:
      - "codex/**"
      - "!codex/**/*.md"
      - ".github/workflows/codex-tests.yml"
  workflow_dispatch: {}

permissions: {}

# A newer push to the same PR makes the older run's result moot.
concurrency:
  group: codex-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: codex/requirements-dev.txt

      - name: Install dev dependencies
        working-directory: codex
        run: pip install -r requirements-dev.txt

      - name: Lint (black, isort, flake8)
        working-directory: codex
        run: |
          python -m black --check .
          python -m isort --check .
          python -m flake8 .

      - name: Run pytest with coverage (fails under the pyproject threshold)
        working-directory: codex
        run: python -m pytest --cov

  docker-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: codex
          push: false
          load: true
          tags: codex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: docker run -d --name codex-ci -p 8890:5000 codex:ci

      - name: Wait for the app to come up
        run: curl -sf --retry 15 --retry-all-errors --retry-delay 1 -o /dev/null http://localhost:8890/

      - name: Smoke test index and a character sheet
        run: |
          curl -sf -o /dev/null -w "index: %{http_code}\n" http://localhost:8890/
          curl -sf -o /dev/null -w "sample sheet: %{http_code}\n" \
            http://localhost:8890/characters/sample_character
          curl -sf -o pdf-smoke.pdf -w "sample pdf: %{http_code} %{content_type}\n" \
            http://localhost:8890/characters/sample_character/pdf
          head -c 4 pdf-smoke.pdf | grep -q '%PDF'

      - name: Container logs
        if: failure()
        run: docker logs codex-ci
