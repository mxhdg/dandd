name: Build and publish sheet-app image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to apply to the image (e.g. v1.2.3). Only needed if running against a branch instead of a version tag; leave blank otherwise."
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sheet-app

permissions: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sheet-app-image-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write # required for cosign keyless signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Determine app version
        id: version
        shell: python3 {0}
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          INPUT_VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          import os

          ref_type = os.environ["GITHUB_REF_TYPE"]
          ref_name = os.environ["GITHUB_REF_NAME"]
          input_version = os.environ.get("INPUT_VERSION", "")

          if ref_type == "tag":
              app_version = ref_name
          elif input_version:
              app_version = input_version
          else:
              app_version = "dev"

          commit_sha = os.environ["COMMIT_SHA"][:7]

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"app_version={app_version}\n")
              fh.write(f"app_commit_sha={commit_sha}\n")

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: sheet-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            APP_COMMIT_SHA=${{ steps.version.outputs.app_commit_sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        shell: python3 {0}
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          import os
          import subprocess

          image_ref = f"{os.environ['REGISTRY']}/{os.environ['IMAGE_NAME']}@{os.environ['IMAGE_DIGEST']}"
          subprocess.run(["cosign", "sign", "--yes", image_ref], check=True)

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "0"
          severity: "CRITICAL,HIGH"
