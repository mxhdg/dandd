name: Require codex version bump

on:
  pull_request:
    paths:
      - "codex/**"
      - "!codex/**/*.md"

permissions: {}

jobs:
  check-version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check codex/pyproject.toml version was bumped
        shell: python3 {0}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import os
          import subprocess
          import sys
          import tomllib

          sys.path.insert(0, ".github/scripts")
          import semver

          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]

          diff = subprocess.run(
              ["git", "diff", "--name-only", base_sha, head_sha, "--", "codex"],
              capture_output=True,
              text=True,
              check=True,
          )
          changed = [f for f in diff.stdout.splitlines() if f and not f.endswith(".md")]
          if not changed:
              print("No codex code changes in this PR, no version bump required.")
              sys.exit(0)

          print("Changed codex files:")
          for f in changed:
              print(f"  {f}")

          def version_at(ref):
              result = subprocess.run(
                  ["git", "show", f"{ref}:codex/pyproject.toml"],
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  return "0.0.0"  # file didn't exist yet at this ref
              return tomllib.loads(result.stdout)["project"]["version"]

          base_version = version_at(base_sha)
          head_version = version_at(head_sha)

          print(f"Base version: {base_version}")
          print(f"Head version: {head_version}")

          if semver.parse(head_version) is None:
              print(
                  "::error::codex/pyproject.toml version "
                  f"{head_version!r} is not a valid SemVer 2.0.0 version "
                  "(MAJOR.MINOR.PATCH[-prerelease][+build])."
              )
              sys.exit(1)

          if head_version == base_version:
              print(
                  "::error::codex code changed but codex/pyproject.toml's "
                  f"[project] version was not changed from {base_version}. Bump it "
                  "(patch/minor/major, a new -prerelease, or a new +build suffix) "
                  "as part of this PR."
              )
              sys.exit(1)

          if semver.precedence_key(head_version) < semver.precedence_key(base_version):
              print(
                  "::error::codex/pyproject.toml's [project] version was "
                  f"changed to {head_version}, which is older than the base "
                  f"branch's {base_version} by SemVer precedence. Bump it "
                  "forward instead."
              )
              sys.exit(1)

          print("Version bump OK.")
