name: Require sheet-app version bump

on:
  pull_request:
    paths:
      - "sheet-app/**"
      - "!sheet-app/**/*.md"

permissions: {}

jobs:
  check-version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check sheet-app/pyproject.toml version was bumped
        shell: python3 {0}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import os
          import subprocess
          import sys
          import tomllib

          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]

          diff = subprocess.run(
              ["git", "diff", "--name-only", base_sha, head_sha, "--", "sheet-app"],
              capture_output=True,
              text=True,
              check=True,
          )
          changed = [f for f in diff.stdout.splitlines() if f and not f.endswith(".md")]
          if not changed:
              print("No sheet-app code changes in this PR, no version bump required.")
              sys.exit(0)

          print("Changed sheet-app files:")
          for f in changed:
              print(f"  {f}")

          def version_at(ref):
              result = subprocess.run(
                  ["git", "show", f"{ref}:sheet-app/pyproject.toml"],
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  return "0.0.0"  # file didn't exist yet at this ref
              return tomllib.loads(result.stdout)["project"]["version"]

          base_version = version_at(base_sha)
          head_version = version_at(head_sha)
          base_parts = tuple(int(p) for p in base_version.split("."))
          head_parts = tuple(int(p) for p in head_version.split("."))

          print(f"Base version: {base_version}")
          print(f"Head version: {head_version}")

          if head_parts <= base_parts:
              print(
                  "::error::sheet-app code changed but sheet-app/pyproject.toml's "
                  f"[project] version was not bumped above {base_version}. Bump it "
                  "(patch/minor/major) as part of this PR."
              )
              sys.exit(1)

          print("Version bump OK.")
