name: Build and publish codex image

on:
  push:
    tags:
      - "v*"
  schedule:
    # Tuesdays 06:00 UTC: rebuild from main with fresh base layers and OS packages
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to apply to the image (e.g. v1.2.3). Only needed if running against a branch instead of a version tag; leave blank otherwise."
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/codex

permissions: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: codex-image-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write # required for cosign keyless signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the weekly rebuild needs tags to name its version

      # Weekly rebuild (and a manual run from main with no version given): build
      # the newest stable release (not whatever is on main) and re-publish it under that release's own version tag, so a
      # deployment pinned to vX.Y.Z gets the patches too.
      - name: Resolve latest stable release tag
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.version == '' && github.ref == 'refs/heads/main'))
        id: latest
        shell: python3 {0}
        run: |
          import os
          import subprocess
          import sys

          sys.path.insert(0, ".github/scripts")
          import semver

          tags = subprocess.run(
              ["git", "tag", "--list", "v[0-9]*"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout.split()
          stable = [
              t
              for t in tags
              if (p := semver.parse(t.removeprefix("v"))) and not p["prerelease"]
          ]
          if not stable:
              raise SystemExit("no stable vX.Y.Z release tag found")
          tag = max(stable, key=lambda t: semver.precedence_key(t.removeprefix("v")))
          print(f"Latest stable release: {tag}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"tag={tag}\n")

      - name: Check out the latest release tag
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.version == '' && github.ref == 'refs/heads/main'))
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
        run: git checkout --detach "refs/tags/$LATEST_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record the commit being built
        id: rev
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,enable=${{ !(github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.version == '' && github.ref == 'refs/heads/main')) }}
            type=raw,value=sha-${{ steps.rev.outputs.short }},enable=${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.version == '' && github.ref == 'refs/heads/main')) }}
            type=raw,value=${{ steps.latest.outputs.tag }},enable=${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.version == '' && github.ref == 'refs/heads/main')) }}
            type=ref,event=tag
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Determine app version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          REV_SHORT: ${{ steps.rev.outputs.short }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            app_version="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            app_version="$INPUT_VERSION"
          elif [ -n "$LATEST_TAG" ]; then
            app_version="$LATEST_TAG"
          else
            app_version="dev-${GITHUB_SHA::7}"
          fi
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "app_commit_sha=$REV_SHORT" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: codex
          push: true
          pull: true
          no-cache: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.version == '' && github.ref == 'refs/heads/main')) }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            APP_COMMIT_SHA=${{ steps.version.outputs.app_commit_sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REGISTRY/$IMAGE_NAME@$IMAGE_DIGEST"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      # Weekly run only: fail (so GitHub emails the repo owner) when a CRITICAL
      # vulnerability with an available fix is in the freshly built image.
      - name: Fail weekly build on fixable CRITICAL vulnerabilities
        if: github.event_name == 'schedule'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: true
