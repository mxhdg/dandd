name: sheet-app tests

on:
  pull_request:
    paths:
      - "sheet-app/**"
      - "!sheet-app/**/*.md"
  push:
    branches: [main]
    paths:
      - "sheet-app/**"
      - "!sheet-app/**/*.md"
  workflow_dispatch: {}

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dev dependencies
        working-directory: sheet-app
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Check formatting (black)
        working-directory: sheet-app
        run: python -m black --check .

      - name: Lint (flake8)
        working-directory: sheet-app
        run: python -m flake8 .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dev dependencies
        working-directory: sheet-app
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run pytest
        working-directory: sheet-app
        run: python -m pytest

  docker-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image (not pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: sheet-app
          push: false
          load: true
          tags: sheet-app:ci

      - name: Run container
        run: docker run -d --name sheet-app-ci -p 8890:5000 sheet-app:ci

      - name: Wait for the app to come up
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8890/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::sheet-app never became ready"
          exit 1

      - name: Smoke test index and a character sheet
        run: |
          curl -sf -o /dev/null -w "index: %{http_code}\n" http://localhost:8890/
          curl -sf -o /dev/null -w "sample sheet: %{http_code}\n" \
            http://localhost:8890/characters/sample_character

      - name: Container logs
        if: always()
        run: docker logs sheet-app-ci

      - name: Stop container
        if: always()
        run: docker rm -f sheet-app-ci
