name: Clean up old codex images

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch: {}

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Skips anything a `latest` or `vX.Y.Z` tag still reaches (its child
      # manifests and cosign signatures), not just the tagged version itself.
      - name: Find codex image versions older than 30 days
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: python3 -I .github/scripts/ghcr_cleanup.py

      - name: Delete stale versions
        if: steps.stale.outputs.ids != ''
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: dandd/codex
          package-type: container
          package-version-ids: ${{ steps.stale.outputs.ids }}
