name: Cut a release

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  tag-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine release tag from sheet-app/pyproject.toml
        id: version
        shell: python3 {0}
        run: |
          import os
          import subprocess
          import sys
          import tomllib

          sys.path.insert(0, ".github/scripts")
          import semver

          with open("sheet-app/pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          if semver.parse(version) is None:
              raise SystemExit(
                  "sheet-app/pyproject.toml version is not a valid SemVer 2.0.0 "
                  f"version (MAJOR.MINOR.PATCH[-prerelease][+build]): {version}"
              )

          new_tag = f"v{version}"

          result = subprocess.run(
              ["git", "tag", "--list", "v*"],
              capture_output=True,
              text=True,
              check=True,
          )
          existing_tags = [t for t in result.stdout.splitlines() if t]

          if new_tag in existing_tags:
              raise SystemExit(
                  f"tag {new_tag} already exists. Bump the version (or its "
                  "-prerelease/+build suffix) before releasing."
              )

          released_versions = [t.removeprefix("v") for t in existing_tags]
          valid_released_versions = [
              v for v in released_versions if semver.parse(v) is not None
          ]
          latest = max(
              valid_released_versions, key=semver.precedence_key, default="0.0.0"
          )

          if semver.precedence_key(version) < semver.precedence_key(latest):
              raise SystemExit(
                  f"sheet-app/pyproject.toml version ({version}) is older than "
                  f"the latest release (v{latest}) by SemVer precedence. Bump it "
                  "in a PR before releasing."
              )

          print(f"Previous tag: v{latest}")
          print(f"New tag: {new_tag}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"new_tag={new_tag}\n")

      - name: Create and push tag
        shell: python3 {0}
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          import os
          import subprocess

          new_tag = os.environ["NEW_TAG"]

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"],
              check=True,
          )
          subprocess.run(["git", "tag", new_tag], check=True)
          subprocess.run(["git", "push", "origin", new_tag], check=True)

      - name: Trigger image build for new tag
        shell: python3 {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          import os
          import subprocess

          new_tag = os.environ["NEW_TAG"]
          subprocess.run(
              ["gh", "workflow", "run", "sheet-app-image.yml", "--ref", new_tag],
              check=True,
          )

      - name: Summary
        shell: python3 {0}
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          import os

          new_tag = os.environ["NEW_TAG"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"Released **{new_tag}** and triggered the image build.\n")
