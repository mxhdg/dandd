name: Cut a release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions: {}

jobs:
  tag-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: python3 {0}
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          import os
          import re
          import subprocess

          bump = os.environ["BUMP"]

          result = subprocess.run(
              ["git", "tag", "--list", "v[0-9]*.[0-9]*.[0-9]*", "--sort=-v:refname"],
              capture_output=True,
              text=True,
              check=True,
          )
          tags = [t for t in result.stdout.splitlines() if t]
          latest = tags[0] if tags else "v0.0.0"

          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", latest)
          if not match:
              raise SystemExit(f"Could not parse version from tag: {latest}")
          major, minor, patch = (int(part) for part in match.groups())

          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1
          else:
              raise SystemExit(f"Unrecognized bump type: {bump}")

          new_tag = f"v{major}.{minor}.{patch}"
          print(f"Previous tag: {latest}")
          print(f"New tag: {new_tag}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"new_tag={new_tag}\n")

      - name: Create and push tag
        shell: python3 {0}
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          import os
          import subprocess

          new_tag = os.environ["NEW_TAG"]

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"],
              check=True,
          )
          subprocess.run(["git", "tag", new_tag], check=True)
          subprocess.run(["git", "push", "origin", new_tag], check=True)

      - name: Trigger image build for new tag
        shell: python3 {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          import os
          import subprocess

          new_tag = os.environ["NEW_TAG"]
          subprocess.run(
              ["gh", "workflow", "run", "sheet-app-image.yml", "--ref", new_tag],
              check=True,
          )

      - name: Summary
        shell: python3 {0}
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          import os

          new_tag = os.environ["NEW_TAG"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"Released **{new_tag}** and triggered the image build.\n")
