      <div class="combat-grid">
        <div class="field"><span class="label">Armor Class</span><span class="value">{{ c.combat.ac }}</span></div>
        <div class="field"><span class="label">Initiative</span><span class="value">{{ c.combat.initiative }}</span></div>
        <div class="field"><span class="label">Speed</span><span class="value">{{ c.combat.speed }}</span></div>
      </div>

      <div class="boxed-section">
        <div class="section-title">Hit Points</div>
        <div class="box">
          <div class="field"><span class="label">Hit Point Maximum</span><span class="value">{{ c.hp.max }}</span></div>
          <div class="field mt-6"><span class="label">Current Hit Points</span><span class="value"><input type="number" class="sheet-input" name="hp_current" value="{{ c.hp.current }}"></span></div>
          <div class="field mt-6"><span class="label">Temporary Hit Points</span><span class="value"><input type="number" class="sheet-input" name="hp_temp" value="{{ c.hp.temp }}"></span></div>
          <div class="field mt-6"><span class="label">Damage Taken</span><span class="value"><input type="number" min="0" class="sheet-input" name="damage_taken" value="0"></span></div>
          <div class="field mt-6"><span class="label">Healing Received</span><span class="value"><input type="number" min="0" class="sheet-input" name="healing_received" value="0"></span></div>
        </div>
      </div>
