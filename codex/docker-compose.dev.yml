name: codex-dev

services:
  codex-dev:
    container_name: codex-dev
    labels:
      environment: "dev"
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    ports:
      - "8890:5000"
    volumes:
      - ./data:/app/data
      - ./state:/app/state
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    # Hostnames other than localhost, IP addresses, single-label names and
    # *.local/*.lan/*.home.arpa are refused (DNS-rebinding guard). To reach
    # the app through another name, e.g. behind a reverse proxy, list it here:
    # environment:
    #   CODEX_ALLOWED_HOSTS: codex.example.com
