personality:
  traits: Overthinks every choice, afraid of disappointing someone or choosing wrong. When
    watched, she slips into a practiced, “acceptable” persona. Convinced her real self is
    too much or not enough, she stays gentle even when unraveling, never wanting to burden
    anyone.
  ideals: 'Kindness, even when it costs her: people deserve the gentleness she went without.
    She values quiet integrity over bold declarations, and wants to do what’s right, not what’s
    expected, though she struggles to tell them apart. She hopes understanding can lead to
    something better than the roles she’s played.'
  bonds: She holds tight to anyone who has ever accepted her and feels obliged to be what
    they need, even when it strains her. Loyal because she knows how it hurts to be left behind.
    Her bonds steady her, but also pull her back into the roles she thinks she must play to
    stay wanted.
  flaws: Doubts herself constantly and assumes she’s at fault. Unsure where her real thoughts
    end and the practiced ones begin. Hides her needs until they’re impossible to ignore,
    sure that asking makes her a burden. When overwhelmed, she retreats into silence and overthinking.
features:
- name: Spellcasting
  text: 'Int is your spellcasting ability. Ritual Adept: cast Ritual spells from your spellbook.'
- name: Arcane Recovery
  text: After a Short Rest, recover spell slots with combined level up to 2 (none 6th+). Once
    per Long Rest.
- name: Scholar
  text: Expertise in one skill you're proficient in (Arcana).
- name: Divination Savant
  text: Add two Divination spells (max level 2) to your spellbook free; add one Divination
    Wizard spell free whenever you gain a new slot level.
- name: Portent
  text: After a Long Rest, roll 2d20 and record them. Replace any D20 Test by you or a creature
    you can see with one of these rolls, once per turn. Unused rolls are lost on your next
    Long Rest.
- name: 'Human: Resourceful'
  text: Gain Heroic Inspiration after each Long Rest.
- name: 'Human: Skillful'
  text: Proficiency in one skill of your choice.
- name: 'Human: Versatile'
  text: Gain an Origin feat of your choice.
- name: Alert
  text: Add proficiency bonus (+2) to Initiative. After rolling Initiative, swap with a willing
    ally in the same combat (neither Incapacitated).
- name: Magic Initiate (Wizard)
  text: 'Two cantrips (True Strike, Minor Illusion) and Chromatic Orb: cast once free per
    Long Rest or with any spell slot. Int is the casting ability. Can swap the spell on level-up.'
- name: 'Sage: Ability Score Improvements'
  text: +2 / +1 to two scores.
