backstory: 'She grew up learning that being herself came with consequences. Two people shaped
  that lesson more than anyone else. Garron Hale, her uncle, was harsh and unyielding, always
  reminding her of who he believed she should be. The other was Lyra, a younger relative she
  helped raise, who watched her with sharp, expectant eyes. Lyra adored her, but also mirrored
  the judgments of the adults around them, leaving her caught between wanting to protect the
  girl and feeling crushed by the pressure to be the version of herself Lyra seemed to need.


  Between Garron''s criticism and Lyra''s innocent but heavy expectations, she learned to
  survive by performing. She became quiet, careful, and endlessly accommodating, slipping
  into a practiced persona that kept the peace even as it hollowed her out. Books and magic
  became her refuge, the only places where she could breathe without pretending.


  She was the first in her family to feel any magic, and she was shunned for it. It first
  stirred while she was cooking beside her aunt Rhonda, a chef whose kitchen was her whole
  world, and the one person who supported her. When Hazel fled, Rhonda gave her her own recipe
  book. It has become, in effect, Hazel’s grimoire.


  Leaving home gave her distance, but not freedom. She still fears being seen too clearly,
  still worries that her real self is too much or not enough. Yet she also carries a fragile
  hope that she can grow beyond the roles Garron and Lyra forced onto her. Adventuring is
  her way of searching for a life where she can finally exist without the mask, even if she
  is still learning who that unmasked version of herself might be.'
allies:
- name: Rhonda (her aunt)
  text: A chef whose kitchen was her whole world. She supported Hazel’s magic and gave her
    the recipe book that is now her grimoire.
treasure:
  title: Staff of Frost
  text: Attuned. Bought second-hand at a magic thrift store and not owned for long, but it
    helped her defeat a big bad in her previous campaign. Currently 5/10 charges.
