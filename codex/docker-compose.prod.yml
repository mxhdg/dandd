services:
  codex:
    image: ghcr.io/mxhdg/dandd/codex:${CODEX_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8889:5000"
    volumes:
      - /opt/codex/data:/app/data
      - /opt/codex/state:/app/state
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
