[project]
name = "codex"
version = "1.3.1-rc2"

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = [
    'if __name__ == "__main__":',
]
