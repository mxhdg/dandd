# Personality
personality:
  traits: "I am fiercely independent and resourceful, accustomed to relying on myself alone."
  ideals: "Freedom. I value autonomy and the ability to chart my own course. (Neutral Good)"
  bonds: "Doug, my fire-breathing rabbit companion, is my most trusted ally. I would do anything to protect him."
  flaws: "I have difficulty trusting others or working in a group. I prefer to handle things myself."

# Companion
companion:
  name: Doug
  type: Fire-Breathing Rabbit
  homebrew: true
  note: "DM-approved homebrew content"
  
  stats:
    armor_class: 13
    hit_points: 12
    speed:
      ground: 30
      burrow: 10
  
  abilities:
    - name: Fire Breath
      uses: 1
      recovery: long rest
      description: "Exhales fire in a 10-ft cone. Each creature in that area must make a DC 11 Dexterity saving throw, taking 2d6 fire damage on a failed save, or half as much on a successful one."
    - name: Fiery Bite
      attack_bonus: 4
      reach: 5
      damage: "1d6 piercing + 1d6 fire"
      description: "Melee Weapon Attack"
  
  personality: "Mischievous and fiercely loyal to Elowen"

# Appearance & Backstory
appearance:
  age: 34
  height: null
  weight: null
  eyes: null
  skin: null
  hair: "Chestnut, sun-lightened"
  
description: "Elowen is a 34-year-old half-elf with chestnut hair sun-lightened from years outdoors. She carries herself with the quiet confidence of someone who has survived alone in the wild. Her gear is practical, worn, and well-maintained. A carved wooden elven flute hangs from her pack — a sentimental relic of her mother's people."

