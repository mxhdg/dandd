# Features & Traits
features:
  # Racial Traits
  racial_traits:
    - name: Darkvision
      description: "60 ft darkvision"
    - name: Fey Ancestry
      description: "Advantage on saves vs. being charmed; magic can't put you to sleep"
    - name: Skill Versatility
      description: "Proficiency in two additional skills (Animal Handling, Perception)"
  
  # Fighter Features
  fighter_features:
    - name: Fighting Style - Archery
      description: "+2 bonus to attack rolls with ranged weapons"
    - name: Second Wind
      description: "Bonus action to regain 1d10 + 3 hit points"
      uses: 1
      recovery: short rest
    - name: Action Surge
      description: "Take one additional action on your turn"
      uses: 1
      recovery: short rest
  
  # Battle Master Features
  battle_master:
    superiority_dice:
      total: 4
      die_type: d8
      recovery: short rest
    maneuver_save_dc: 12
    maneuvers:
      - name: Parry
        description: "When damaged by a melee attack, use your reaction to reduce damage by 1d8 + 3"
      - name: Riposte
        description: "When a creature misses you with a melee attack, use your reaction to make one melee weapon attack against it. Add superiority die to damage"
      - name: Trip Attack
        description: "When you hit with a weapon attack, add superiority die to damage and target must succeed on Str save or be knocked prone"
  
  # Ranger Features
  ranger_features:
    - name: Favored Enemy - Beasts
      description: "Advantage on Wisdom (Survival) checks to track beasts and Intelligence checks to recall information about them"
    - name: Natural Explorer - Forest
      benefits:
        - "Difficult terrain doesn't slow your group's travel"
        - "Your group can't become lost except by magical means"
        - "Remain alert to danger even when foraging, tracking, or navigating"
        - "Move stealthily at normal pace when alone"
        - "Find twice as much food when foraging"
        - "When tracking, learn exact number, sizes, and how long ago creatures passed"
  
  # Background Feature
  background_feature:
    name: Wanderer
    description: "You have an excellent memory for maps and geography, and you can always find food and fresh water for yourself and up to five others each day, provided the land offers berries, small game, water, etc."

